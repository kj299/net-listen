name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag -a v0.1.3 -m "net-listen v0.1.3" && git push origin v0.1.3
# This builds the binaries on Windows and Linux, smoke-tests them, and
# publishes them on a GitHub Release for that tag.
#
# Third-party actions are pinned to exact commit SHAs, with the version in a
# trailing comment. To bump one, resolve the new tag and replace both:
#   git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the build, so a tag whose changelog section was never promoted
      # out of [Unreleased] fails here rather than publishing empty notes.
      - name: Release notes
        shell: bash
        run: bash tools/release-notes.sh "$GITHUB_REF_NAME"

      - name: Install NASM
        uses: ilammy/setup-nasm@e77cc62a22a374a4d0668286007cc3e3b4c17760 # v1.5.2

      - name: Build
        shell: cmd
        run: mingw32-make

      # Never publish untested binaries: the release build is independent of
      # the push CI, so run the full smoke test against these exact exes.
      - name: Smoke test
        shell: pwsh
        run: .\smoketest.ps1

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path c_listener.exe, asm_listener.exe -DestinationPath net-listen-windows-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: net-listen-windows-x64.zip
          body_path: RELEASE_NOTES.md

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both jobs write the same notes from the same tag, so whichever reaches
      # the release first, the body is identical.
      - name: Release notes
        run: bash tools/release-notes.sh "$GITHUB_REF_NAME"

      - name: Build
        run: make

      - name: Smoke test
        run: |
          ./c_listener 54321 54322 &
          pid=$!
          sleep 1
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "c_listener exited prematurely"; exit 1
          fi
          kill -INT "$pid" || true
          wait "$pid" 2>/dev/null || true
          echo "c_listener bound and ran"

      - name: Package
        run: tar -czf net-listen-linux-x64.tar.gz c_listener

      - name: Attach to release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: net-listen-linux-x64.tar.gz
          body_path: RELEASE_NOTES.md
